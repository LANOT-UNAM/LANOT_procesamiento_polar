###############################################################################
###                Polar2Grid Example Grid Configuration File               ###
###############################################################################
# Description: This file provides a few working examples of various types of
#              grids that can be added to polar2grid. This file is to help
#              a user add their own grids to polar2grid in addition to the
#              documentation at
#              http://www.ssec.wisc.edu/software/polar2grid/dev_guide/grids.html
#              There is also additional information about this format from the
#              pyresample documentation at
#              https://pyresample.readthedocs.io/en/latest/geometry_utils.html
#
# Grids (a.k.a "areas") can be specified with as much information as is known
# and anything that is missing will be filled in at runtime with the input
# geolocation data. Grids that need this additional information are known as
# "dynamics" grids.
# Note that "extent" information defines the outer edge of the grid and not the
# center of the pixels.
#
###############################################################################
### NOTE: Polar2Grid does not use this file by default                      ###
###       Use `--grid-configs my_grids.yaml` to add your own grids          ###
###############################################################################
wgs84_geo_750m:
  description: 'EPSG:4326 - WGS 84'
  projection:
    EPSG: 4326
  resolution:
    dy: 0.007238
    dx: 0.007238
wgs84_geo_375m:
  description: 'EPSG:4326 - WGS 84'
  projection:
    EPSG: 4326
  resolution:
    dy: 0.003619
    dx: 0.003619
# Sondeos NUCAPS (lector `nucaps`). Nada que ver con VIIRS: la unidad del dato es
# el FOR de CrIS, de unos 50 km, así que las rejillas de arriba sobremuestrean por
# tres órdenes de magnitud. Medido el 2026-08-17 sobre 19 gránulos de muestra: la
# rejilla dinámica de Polar2Grid (`wgs84_fit`) eligió 0.0057° —633 m— y produjo
# 6523 × 6734 píxeles, o sea 44 Mpx para 2 280 puntos de dato reales, con huecos
# negros entre huellas porque el vecino más cercano no alcanza a llenar.
# A 5 km la misma escena sale en ~770 × 795 y cada FOR ocupa ~9 × 9 píxeles: se
# conserva el aspecto de mosaico, que es lo honesto para un sondeo por FOR.
# El valor es el escalado exacto de wgs84_geo_750m: 0.007238 × 5000/750.
wgs84_geo_5km:
  description: 'EPSG:4326 - WGS 84'
  projection:
    EPSG: 4326
  resolution:
    dy: 0.048253
    dx: 0.048253
wgs84_geo_1000m:
  description: 'EPSG:4326 - WGS 84'
  projection:
    EPSG: 4326
  resolution:
    dy: 0.014535
    dx: 0.014535
wgs84_geo_500m:
  description: 'EPSG:4326 - WGS 84'
  projection:
    EPSG: 4326
  resolution:
    dy: 0.0072675
    dx: 0.0072675
wgs84_geo_250m:
  description: 'EPSG:4326 - WGS 84'
  projection:
    EPSG: 4326
  resolution:
    dy: 0.00363375
    dx: 0.00363375
itrf2008_lcc_750m:
